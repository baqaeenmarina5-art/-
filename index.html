<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أصدقاء الأرض – لعبة تفاعلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="stage">
  <div class="sun">☀️</div>
  <div class="cloud c1">☁️</div>
  <div class="cloud c2">☁️</div>
  <div class="cloud c3">☁️</div>

  <header class="top">
    <div class="brand"><span class="globe">🌍</span> أصدقاء الأرض</div>
    <div class="tagline">لعبة تعليمية تفاعلية لرياض الأطفال — حروف، أعداد، ورياضيات</div>
    <div class="scoreboard">
      <div class="pill">⭐ نجومي: <span id="totalStars">0</span></div>
      <div class="pill">🏝️ الجزر المكتملة: <span id="doneCount">0</span> / <span id="levelCount">0</span></div>
    </div>
  </header>

  <section id="home">
    <div id="homeSections"></div>
  </section>

  <section id="quiz">
    <div class="quiz-head" style="margin-top:12px;">
      <button class="back-btn" id="backBtn">↩ رجوع للخريطة</button>
      <div class="level-tag"><span class="chip" id="quizChip"></span><span id="quizTitle"></span></div>
    </div>
    <div class="quiz-card">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="prompt" id="prompt"></div>
      <div class="sub-hint" id="subHint"></div>
      <div id="countBox" class="count-box" style="display:none;"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn">التالي ←</button>
    </div>
  </section>

  <section id="levelResult">
    <div class="result-card">
      <div class="big-emoji" id="lrEmoji">🎉</div>
      <div class="result-title" id="lrTitle">أحسنت!</div>
      <div class="result-sub" id="lrSub"></div>
      <div class="stars-row" id="lrStars"></div>
      <div class="btn-row">
        <button class="btn ghost" id="lrHomeBtn">خريطة الجزر 🗺️</button>
        <button class="btn primary" id="lrRetryBtn">أعد اللعب 🔁</button>
      </div>
    </div>
  </section>

  <section id="finalScreen">
    <div class="result-card">
      <div class="big-emoji">🏆</div>
      <div class="result-title">لقد أنهيت جميع الجزر!</div>
      <div class="result-sub" id="finalSub"></div>
      <div class="result-sub" style="font-size:18px; font-weight:900; color:var(--ink); margin-top:-6px;">تمَّ بحمد الله 🌍💚</div>
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn primary" id="finalRestartBtn">العب من جديد 🔁</button>
      </div>
    </div>
  </section>

  <footer class="credit">حروف 🔤 • أعداد 🔢 • جمع وطرح ➕ • أشكال 🔺 • تصنيف وتدوير ♻️ — تعلّم واستمتع!</footer>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
